# Input
source-root: ..
# Directories that contain documented source files
input:
  - ../include
# Patterns to filter out the source-files in the directories
file-patterns:
  - '*.hpp'

# Filters
include-symbols:
  - 'boost::websocket::**'
implementation-defined:
  - 'boost::websocket::detail'
  - 'boost::websocket::*::detail'
inaccessible-members: never
inaccessible-bases: never

# Generator
generate: adoc
base-url: https://www.github.com/cppalliance/websocket/blob/develop/include/

# Style
verbose: true
multipage: true
use-system-libc: true
use-system-stdlib: true

cmake: '-DCMAKE_CXX_STANDARD=20 -DBOOST_WEBSOCKET_BUILD_TESTS=OFF -DBOOST_WEBSOCKET_BUILD_EXAMPLES=OFF'
